<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GSSSB Test Lab</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs" type="module"></script>
<style>
:root{--ink:#10211e;--ink2:#18302b;--paper:#f6f1e6;--paper2:#fffdf7;--line:#d8cfbf;--gold:#b78943;--gold2:#d3ad70;--muted:#756f66;--red:#9c4b42;--green:#3d705d}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font-family:Inter,Arial,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}
.login{min-height:100vh;display:grid;grid-template-columns:57% 43%;background:var(--ink)}.hero{position:relative;overflow:hidden;padding:48px 6vw;color:#f8f1e4;background:radial-gradient(circle at 80% 20%,#315046 0,#18322e 35%,#0c1917 72%)}.hero:after{content:"GUJARAT";position:absolute;right:-80px;bottom:20px;font:italic 130px Georgia;color:#fff1;letter-spacing:8px;transform:rotate(-8deg)}.brand{display:flex;align-items:center;gap:13px}.crest{height:46px;width:46px;border:1px solid var(--gold2);border-radius:50%;display:grid;place-items:center;color:var(--gold2);font-size:21px}.brand b{display:block;font:700 29px Georgia;letter-spacing:1px}.brand span{display:block;font-size:9px;letter-spacing:5px;color:var(--gold2);margin-top:2px}.hero .eyebrow{margin-top:105px;color:#c8b99e}.hero h1{font:700 clamp(65px,9vw,125px)/.8 Georgia;margin:18px 0 5px;letter-spacing:-5px}.hero h2{font:42px Georgia;color:var(--gold2);letter-spacing:9px;margin:18px 0}.guj{font-size:22px;color:#d9c49b;margin-top:25px}.featureline{position:absolute;bottom:48px;display:flex;gap:0}.featureline div{font-size:10px;letter-spacing:2px;padding:0 24px;border-left:1px solid #66756e}.featureline div:first-child{padding-left:0;border:0}.auth{display:flex;align-items:center;justify-content:center;padding:35px;background:#eae2d2}.panel{width:min(500px,100%);padding:46px;background:var(--paper2);border-radius:26px;box-shadow:0 30px 90px #0003}.lang{text-align:right;color:#8d6d42;font-size:12px}.seal{text-align:center;margin:14px 0 4px;color:var(--gold);font-size:35px}.panel h3{text-align:center;font:38px Georgia;margin:5px 0 8px;letter-spacing:5px}.panel .sub{text-align:center;color:var(--muted);margin:0 0 28px}.tabs{display:grid;grid-template-columns:1fr 1fr;margin-bottom:20px;border-bottom:1px solid var(--line)}.tabs button{border:0;background:none;padding:12px;color:#8b8479}.tabs button.active{color:var(--ink);border-bottom:2px solid var(--gold);font-weight:700}.field{height:55px;border:1px solid #cfc5b3;background:#fbf8f0;border-radius:9px;margin:12px 0;display:flex;align-items:center;padding:0 15px}.field span{width:24px;color:#9b8059}.field input{border:0;outline:0;background:none;width:100%;margin-left:8px}.primary{height:54px;border:0;border-radius:8px;background:var(--ink);color:#fff;width:100%;margin-top:10px;font-weight:700}.primary:hover{background:#24443d}.smallnote{text-align:center;color:#8b8479;font-size:12px;line-height:1.6;margin-top:17px}
.top{height:78px;background:var(--ink);color:#f7f0e2;display:flex;align-items:center;padding:0 4vw;gap:34px;position:sticky;top:0;z-index:20}.top .brand b{font-size:21px}.top .brand span{font-size:7px}.nav{display:flex;gap:2px;flex:1}.nav button{border:0;background:none;color:#b9c3bd;padding:28px 13px;font-size:12px}.nav button.active,.nav button:hover{color:white;border-bottom:2px solid var(--gold2)}.userchip{font-size:11px;color:#d7c8aa;border:1px solid #3b504a;padding:9px 12px;border-radius:20px}.logout{border:1px solid #53645e;background:none;color:#fff;padding:9px 12px;border-radius:7px;font-size:11px}
main{max-width:1250px;margin:auto;padding:55px 5vw 100px}.eyebrow{font:10px/1 monospace;letter-spacing:2.5px;color:#9b7440;text-transform:uppercase}.title{font:50px Georgia;margin:12px 0 5px}.subtitle{color:var(--muted);max-width:700px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);margin-top:28px}.metric{background:var(--paper2);padding:27px}.metric small{color:var(--muted);font-size:10px;letter-spacing:1.5px}.metric b{display:block;font:43px Georgia;margin:8px 0}.metric span{font-size:12px;color:var(--green)}
.console{margin-top:28px;background:var(--ink);color:white;padding:34px;border-radius:5px;position:relative;overflow:hidden}.console:after{content:"GSSSB";position:absolute;right:-20px;top:-30px;font:130px Georgia;color:#fff1}.console h2{font:30px Georgia;margin:12px 0}.goldbtn{border:0;background:var(--gold2);color:var(--ink);padding:13px 18px;font-weight:700;border-radius:5px;position:relative;z-index:1}.section{margin-top:28px;border:1px solid var(--line);background:var(--paper2);padding:26px}.section h2{font:25px Georgia;margin:8px 0 12px}.rows{margin-top:28px;border-top:1px solid var(--line)}.row{display:flex;align-items:center;gap:22px;padding:23px 5px;border-bottom:1px solid var(--line)}.num{font:13px monospace;color:var(--gold)}.grow{flex:1}.row h3{font:21px Georgia;margin:4px 0}.row small{font-size:10px;color:var(--muted);letter-spacing:1px}.pill{border:1px solid #cfc5b4;padding:8px 11px;border-radius:18px;font-size:11px;background:none;color:var(--ink)}.pill.dark{background:var(--ink);color:#fff}.notice{padding:13px 15px;border-left:3px solid var(--gold);background:#eee6d6;font-size:12px;margin:15px 0}.danger{border-left-color:var(--red)}.filters{display:flex;gap:10px;flex-wrap:wrap;margin-top:25px}.filters select,.filters input{border:1px solid var(--line);background:var(--paper2);padding:11px 13px;border-radius:7px;outline:0}.adminbar{display:flex;justify-content:space-between;align-items:center;padding:20px 22px;background:var(--ink);color:white;margin-top:28px;border-radius:5px}.uploadbox{border:2px dashed #c7bba7;background:#fbf8ef;text-align:center;padding:50px 20px;margin-top:20px;border-radius:8px}.uploadbox input{display:none}.uploadbox label{display:inline-block;padding:13px 20px;background:var(--ink);color:#fff;border-radius:6px;font-weight:700}.filemeta{margin-top:15px;color:var(--muted);font-size:12px}.preview{margin-top:20px;max-height:320px;overflow:auto;background:#f0eadd;border:1px solid var(--line);padding:16px;white-space:pre-wrap;font:12px/1.55 ui-monospace,monospace}.builder{display:grid;grid-template-columns:1.4fr .8fr;gap:20px;margin-top:20px}.builder textarea{width:100%;min-height:250px;border:1px solid var(--line);padding:14px;background:#fffdf7;resize:vertical}.builder aside{border:1px solid var(--line);padding:20px;background:#fffdf7}.builder label{display:block;font-size:11px;color:var(--muted);margin:12px 0 6px}.builder input,.builder select{width:100%;padding:11px;border:1px solid var(--line);background:#faf6ec}.testscreen{position:fixed;inset:0;background:#f4efe4;z-index:50;display:flex;flex-direction:column}.examtop{height:68px;background:var(--ink);color:white;display:flex;align-items:center;justify-content:space-between;padding:0 25px}.timer{font:20px monospace;color:#e0c080}.exambody{display:grid;grid-template-columns:1fr 280px;flex:1;min-height:0}.question{padding:45px;overflow:auto}.qcard{max-width:820px;margin:auto;background:#fffdf8;border:1px solid var(--line);padding:30px}.qcard h2{font:22px Georgia;line-height:1.5}.option{display:block;border:1px solid var(--line);padding:15px;margin:10px 0;background:#fffdf8;text-align:left}.option.selected{border-color:var(--gold);background:#f4ead6}.palette{border-left:1px solid var(--line);padding:25px;overflow:auto}.palgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin-top:15px}.pal{height:35px;border:1px solid var(--line);background:white}.pal.done{background:#dbe9df}.pal.mark{background:#f0ddbc}.examnav{display:flex;gap:10px;margin-top:25px}.empty{text-align:center;padding:50px;color:var(--muted)}
@media(max-width:900px){.login{grid-template-columns:1fr}.hero{min-height:48vh}.auth{padding:20px}.panel{padding:30px}.featureline{display:none}.top{gap:12px;overflow:auto}.nav{min-width:500px}.grid3,.builder{grid-template-columns:1fr}.exambody{grid-template-columns:1fr}.palette{display:none}.question{padding:15px}}
</style></head>
<body><div id="root"></div>
<script>
const ADMIN_ID='admin@gsssbtestlab.in', ADMIN_PASSWORD='GSSSB@Admin2026';
const state={user:null,role:null,tests:JSON.parse(localStorage.getItem('gsssb_tests')||'[]'),mistakes:JSON.parse(localStorage.getItem('gsssb_mistakes')||'[]'),results:JSON.parse(localStorage.getItem('gsssb_results')||'[]'),page:'home',uploadedText:'',currentTest:null,qIndex:0,answers:{},marked:{}};
const save=()=>{localStorage.setItem('gsssb_tests',JSON.stringify(state.tests));localStorage.setItem('gsssb_mistakes',JSON.stringify(state.mistakes));localStorage.setItem('gsssb_results',JSON.stringify(state.results))};
const root=()=>document.getElementById('root');
function login(){
root().innerHTML=`<div class="login"><section class="hero"><div class="brand"><div class="crest">✦</div><div><b>GSSSB</b><span>TEST LAB</span></div></div><div class="hero eyebrow">GUJARAT SUBORDINATE SERVICES SELECTION BOARD</div><h1>GSSSB</h1><h2>TEST LAB</h2><div class="guj">તમારી તૈયારી, વધુ સ્માર્ટ રીતે</div><div class="featureline"><div>TEST SERIES</div><div>PYQs</div><div>MISTAKE BOOK</div><div>PERFORMANCE</div></div></section><section class="auth"><div class="panel"><div class="lang">ENG&nbsp; | &nbsp;ગુજરાતી</div><div class="seal">✦</div><h3>WELCOME BACK</h3><p class="sub">Enter the GSSSB Test Lab</p><div class="tabs"><button id="studentTab" class="active" onclick="switchAuth('student')">STUDENT</button><button id="adminTab" onclick="switchAuth('admin')">ADMIN</button></div><div id="authFields"><div class="field"><span>◯</span><input id="loginId" placeholder="Email or Mobile Number"></div><div class="field"><span>▣</span><input id="loginPass" type="password" placeholder="Password"></div><button class="primary" onclick="doLogin()">Login →</button></div><p class="smallnote">Students access tests, PYQs, mistakes and analytics.<br>Administrators get the private Test Factory and PDF upload tools.</p></div></section></div>`;
}
let authMode='student';
function switchAuth(mode){authMode=mode;document.getElementById('studentTab').classList.toggle('active',mode==='student');document.getElementById('adminTab').classList.toggle('active',mode==='admin');document.getElementById('loginId').placeholder=mode==='admin'?'Admin ID':'Email or Mobile Number';document.getElementById('loginPass').placeholder=mode==='admin'?'Admin Password':'Password'}
function doLogin(){
const id=document.getElementById('loginId').value.trim(), pw=document.getElementById('loginPass').value;
if(authMode==='admin'){if(id===ADMIN_ID&&pw===ADMIN_PASSWORD){state.user=id;state.role='admin';app();}else alert('Invalid admin credentials.');return}
if(!id||!pw){alert('Enter your login details.');return}state.user=id;state.role='student';app()
}
function navItems(){return state.role==='admin'?['home','tests','pyq','mistakes','analytics','admin']:['home','tests','pyq','mistakes','analytics']}
function app(){root().innerHTML=`<header class="top"><div class="brand"><div class="crest">✦</div><div><b>GSSSB</b><span>TEST LAB</span></div></div><nav class="nav">${navItems().map(x=>`<button data-nav="${x}" onclick="go('${x}')">${({home:'Home',tests:'Test Series',pyq:'PYQ Arena',mistakes:'Mistake Book',analytics:'Performance',admin:'Test Factory'}[x])}</button>`).join('')}</nav><span class="userchip">${state.role==='admin'?'ADMIN':'STUDENT'} · ${state.user}</span><button class="logout" onclick="logout()">Logout</button></header><main id="view"></main>`;go('home')}
function logout(){state.user=null;state.role=null;login()}
function go(p){state.page=p;document.querySelectorAll('[data-nav]').forEach(b=>b.classList.toggle('active',b.dataset.nav===p));const views={home:home,tests:tests,pyq:pyq,mistakes:mistakes,analytics:analytics,admin:admin};views[p]()}
function shell(ey,title,sub,body){document.getElementById('view').innerHTML=`<div class="eyebrow">${ey}</div><h1 class="title">${title}</h1><p class="subtitle">${sub}</p>${body}`}
function home(){shell('YOUR PREPARATION','Good morning, future officer.','A focused GSSSB preparation environment built around real tests, PYQs and your personal error history.',`<div class="console"><div class="eyebrow">NEXT TEST</div><h2>${state.tests[0]?.title||'GSSSB CCE · GRAND MOCK 01'}</h2><p>${state.tests[0]?.questions?.length||100} Questions · 120 Minutes · 200 Marks</p><button class="goldbtn" onclick="go('tests')">Enter Test Lab →</button></div><div class="grid3"><div class="metric"><small>READINESS INDEX</small><b>${Math.min(100,60+state.results.length*4)}</b><span>Calculated from attempts</span></div><div class="metric"><small>TESTS AVAILABLE</small><b>${state.tests.length}</b><span>Admin-published</span></div><div class="metric"><small>MISTAKES</small><b>${state.mistakes.length}</b><span>Personal error database</span></div></div>`)}
function tests(){let body=state.tests.length?'<div class="rows">'+state.tests.map((t,i)=>`<div class="row"><span class="num">${String(i+1).padStart(2,'0')}</span><div class="grow"><small>${t.subject||'GSSSB'} · ${t.type||'FULL LENGTH'}</small><h3>${esc(t.title)}</h3><span>${t.questions.length} Questions · ${t.duration||120} min · ${t.marks||200} marks</span></div><button class="pill dark" onclick="startTest(${i})">Start Test →</button></div>`).join('')+'</div>':'<div class="empty">No tests published yet. Admin can create one from Test Factory.</div>';shell('EXAM SIMULATION','Test Series','Real exam mode with timed questions, palette, marking and automatic result calculation.',body)}
function pyq(){shell('QUESTION ARCHIVE','PYQ Arena','Practice previous GSSSB questions by exam, year and subject.','<div class="filters"><select><option>All Exams</option><option>CCE</option><option>Junior Clerk</option><option>Talati</option><option>PSI</option></select><select><option>All Years</option><option>2025</option><option>2024</option><option>2023</option></select><select><option>All Subjects</option><option>Polity</option><option>History</option><option>Gujarat</option><option>Economy</option></select></div><div class="section"><h2>PYQ engine ready</h2><p>Import PYQs through the Test Factory and they can be indexed here for practice, rapid-fire and mistake tracking.</p></div>')}
function mistakes(){let body=state.mistakes.length?'<div class="rows">'+state.mistakes.map((m,i)=>`<div class="row"><span class="num">${String(i+1).padStart(2,'0')}</span><div class="grow"><h3>${esc(m.text.slice(0,90))}</h3><span>${m.reason||'Review'} · ${m.status||'NEW'}</span></div><span class="pill">${m.status||'REVIEW'}</span></div>`).join('')+'</div>':'<div class="empty">Your mistake book is empty. Wrong and unanswered questions will appear here after tests.</div>';shell('PERSONAL ERROR DATABASE','Mistake Book','Every error becomes a revision item: identify → review → retest → master.',body)}
function analytics(){const n=state.results.length,avg=n?Math.round(state.results.reduce((a,b)=>a+b.score,0)/n):0,acc=n?Math.round(state.results.reduce((a,b)=>a+b.accuracy,0)/n):0;shell('PERFORMANCE LAB','Analytics','Measure score, accuracy, attempt strategy and repeated error patterns.',`<div class="grid3"><div class="metric"><small>AVERAGE SCORE</small><b>${avg}</b><span>Across ${n} attempts</span></div><div class="metric"><small>ACCURACY</small><b>${acc}%</b><span>Answer quality</span></div><div class="metric"><small>AVG TIME</small><b>${n?'—':'—'}</b><span>Detailed timing follows test engine</span></div></div><div class="section"><div class="eyebrow">NEXT ACTION</div><h2>Build consistency before chasing speed.</h2><p>Use the Mistake Book after every attempt and retest unresolved concepts.</p></div>`)}
function admin(){shell('ADMIN · PRIVATE','Test Factory','Upload a question PDF, extract text, review it, and generate a GSSSB test series. Only the admin account can access this area.',`<div class="adminbar"><div><strong>ADMIN CONTROL CENTER</strong><div style="font-size:11px;color:#b9c3bd;margin-top:4px">PDF → Extraction → Review → Test → Publish</div></div><span>SECURE SESSION</span></div><div class="uploadbox"><p><strong>Question PDF / Gujarati PDF</strong></p><p class="filemeta">Supports selectable-text PDFs and scanned PDFs when browser OCR is available.</p><input id="pdfFile" type="file" accept="application/pdf" onchange="handlePdf(event)"><label for="pdfFile">Choose PDF</label><div id="fileMeta" class="filemeta">No file selected</div></div><div id="builderArea"></div>`)}
async function handlePdf(e){const f=e.target.files[0];if(!f)return;document.getElementById('fileMeta').textContent=f.name+' · '+Math.round(f.size/1024)+' KB · extracting…';try{const pdfjs=await import('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs');pdfjs.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.worker.min.mjs';const data=await f.arrayBuffer();const pdf=await pdfjs.getDocument({data}).promise;let text='';for(let p=1;p<=pdf.numPages;p++){const pg=await pdf.getPage(p);const c=await pg.getTextContent();text+=c.items.map(x=>x.str).join(' ')+'\n';if(p>=30)break}state.uploadedText=text;document.getElementById('fileMeta').textContent=f.name+' · '+pdf.numPages+' pages · extracted '+text.length+' characters';renderBuilder()}catch(err){document.getElementById('fileMeta').textContent='Extraction failed: '+err.message;renderBuilder()}}
function renderBuilder(){document.getElementById('builderArea').innerHTML=`<div class="notice">Review the extraction before publishing. The generator never silently invents answers. For complex/scanned Gujarati PDFs, verify the preview against the original PDF.</div><div class="builder"><div><textarea id="sourceText">${esc(state.uploadedText)}</textarea><div class="preview" id="preview">${esc(state.uploadedText.slice(0,5000))||'No extractable text found.'}</div></div><aside><label>TEST TITLE</label><input id="testTitle" value="GSSSB Imported Test"><label>EXAM / CATEGORY</label><select id="testType"><option>CCE</option><option>Junior Clerk</option><option>Revenue Talati</option><option>PSI</option><option>Other GSSSB</option></select><label>SUBJECT</label><input id="testSubject" value="General Studies"><label>DURATION (MINUTES)</label><input id="testDuration" type="number" value="120"><label>MARKS</label><input id="testMarks" type="number" value="200"><button class="primary" onclick="generateTest()">Generate Test Series →</button></aside></div>`}
function generateTest(){const raw=document.getElementById('sourceText').value.trim();if(!raw){alert('No source text. Upload a readable PDF first.');return}const title=document.getElementById('testTitle').value.trim()||'GSSSB Imported Test';const qs=parseQuestions(raw);if(!qs.length){alert('Questions could not be reliably detected. Review the extracted text and use a cleaner/selectable PDF.');return}state.tests.unshift({title,type:document.getElementById('testType').value,subject:document.getElementById('testSubject').value,duration:Number(document.getElementById('testDuration').value)||120,marks:Number(document.getElementById('testMarks').value)||200,questions:qs,published:true,created:new Date().toISOString()});save();alert(qs.length+' questions generated. The test is now available in Test Series.');go('tests')}
function parseQuestions(raw){const chunks=raw.split(/\n\s*(?=(?:Q\.?\s*)?\d{1,3}[\).:\-]\s)/i);const out=[];for(const c of chunks){const m=c.match(/^(?:Q\.?\s*)?(\d{1,3})[\).:\-]\s*([\s\S]+)/i);if(!m)continue;let body=m[2].trim();const opts=[];const re=/(?:^|\s)(?:\(?([A-Da-d]|[અબકડ])\)?[\).:\-])\s+)([\s\S]*?)(?=\s+(?:\(?[A-Da-d]\)?[\).:\-])\s+|$)/g;let x;while((x=re.exec(body))&&opts.length<4)opts.push(x[2].trim());if(opts.length>=2)out.push({number:Number(m[1]),text:body.split(/\s+(?:\(?[A-Da-d]\)?[\).:\-])\s+/)[0].trim(),options:opts.slice(0,4),answer:null});}return out.slice(0,200)}
function startTest(i){const t=state.tests[i];if(!t)return;state.currentTest=t;state.qIndex=0;state.answers={};state.marked={};let seconds=(t.duration||120)*60;root().insertAdjacentHTML('beforeend',`<div class="testscreen" id="testscreen"><div class="examtop"><strong>${esc(t.title)}</strong><span class="timer" id="timer"></span><button class="logout" onclick="finishTest()">Submit Test</button></div><div class="exambody"><div class="question" id="questionArea"></div><aside class="palette"><strong>QUESTION PALETTE</strong><div class="palgrid" id="palette"></div></aside></div></div>`);renderQuestion();const timer=setInterval(()=>{seconds--;if(!document.getElementById('testscreen')){clearInterval(timer);return}document.getElementById('timer').textContent=Math.floor(seconds/60).toString().padStart(2,'0')+':'+(seconds%60).toString().padStart(2,'0');if(seconds<=0){clearInterval(timer);finishTest()}},1000);window.examTimer=timer}
function renderQuestion(){const t=state.currentTest,q=t.questions[state.qIndex];document.getElementById('questionArea').innerHTML=`<div class="qcard"><div class="eyebrow">QUESTION ${state.qIndex+1} / ${t.questions.length}</div><h2>${esc(q.text)}</h2>${q.options.map((o,i)=>`<button class="option ${state.answers[state.qIndex]===i?'selected':''}" onclick="answerQ(${i})">${String.fromCharCode(65+i)}. ${esc(o)}</button>`).join('')}<div class="examnav"><button class="pill" onclick="state.qIndex=Math.max(0,state.qIndex-1);renderQuestion()">← Previous</button><button class="pill" onclick="state.marked[state.qIndex]=!state.marked[state.qIndex];renderQuestion()">${state.marked[state.qIndex]?'Unmark':'Mark for Review'}</button><button class="pill dark" onclick="state.qIndex=Math.min(t.questions.length-1,state.qIndex+1);renderQuestion()">Save & Next →</button></div></div>`;document.getElementById('palette').innerHTML=t.questions.map((_,i)=>`<button class="pal ${state.answers[i]!=null?'done':''} ${state.marked[i]?'mark':''}" onclick="state.qIndex=${i};renderQuestion()">${i+1}</button>`).join('')}
function answerQ(i){state.answers[state.qIndex]=i;renderQuestion()}
function finishTest(){if(!state.currentTest)return;const t=state.currentTest;let attempted=0,correct=0;for(let i=0;i<t.questions.length;i++){if(state.answers[i]!=null){attempted++;if(t.questions[i].answer!=null&&state.answers[i]===t.questions[i].answer)correct++}}const score=t.questions.length?Math.round((correct/t.questions.length)*t.marks):0;const accuracy=attempted?Math.round(correct/attempted*100):0;state.results.push({test:t.title,score,accuracy,attempted,date:new Date().toISOString()});for(let i=0;i<t.questions.length;i++)if(state.answers[i]!=null&&t.questions[i].answer!=null&&state.answers[i]!==t.questions[i].answer)state.mistakes.push({text:t.questions[i].text,reason:'Wrong answer',status:'NEW'});save();clearInterval(window.examTimer);document.getElementById('testscreen')?.remove();state.currentTest=null;alert('Test submitted. Score: '+score+' · Accuracy: '+accuracy+'%');go('analytics')}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
login();
</script></body></html>
